{% extends "citizen_frontend/base.html" %}

{% block content %}
    {% include "citizen_frontend/partials/page_heading.html" %}
    <h2 class="govuk-heading-m" data-testid="action-heading">
        Application cancelled
    </h2>
    <section data-testid="cancelled-licence">
        <p class="govuk-body">
            Your application for <strong>{{ licence.name }}</strong> has been cancelled.
        </p>
        {% if message %}
            <p class="govuk-body" data-testid="message">Message: {{ message }}</p>
        {% endif %}
    </section>
{% endblock %}
