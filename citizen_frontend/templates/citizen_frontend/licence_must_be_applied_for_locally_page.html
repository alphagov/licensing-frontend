{% extends "citizen_frontend/base.html" %}

{% block content %}
    {% if authority_url %}
        <p class="govuk-body">To continue go to
            <a href="{{ authority_url }}"
               data-testid="authority_url"
               class="govuk-link">{{ authority_url }}</a>
        </p>
    {% else %}
        <p class="govuk-body" data-testid="no_authority_link">
            Unfortunately, we don't have a direct link for this Authority, try searching for it on your favourite search
            engine
        </p>
    {% endif %}
{% endblock %}
