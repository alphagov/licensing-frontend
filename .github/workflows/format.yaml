name: Lint and Format

on:
  workflow_call:
    inputs:
      build_branch:
        required: true
        type: string
        description: "Branch to run checks against"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'true'
          repository: '${{ github.repository }}'
          ref: ${{ github.event.inputs.build_branch }}


      - name: Setup Mise
        uses: jdx/mise-action@v4.2.5


      - name: Install UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2


      - name: Lint (fix)
        run: uv run ruff check --fix --output-format=github

      - name: Minimize uv cache
        run: uv cache prune --ci

  format:
    name: Ruff Format
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'true'
          repository: '${{ github.repository }}'
          ref: ${{ github.event.inputs.build_branch }}


      - name: Setup Mise
        uses: jdx/mise-action@v4.2.5


      - name: Install UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2


      - name: Run Format
        run: uv run ruff format --check

      - name: Minimize uv cache
        run: uv cache prune --ci