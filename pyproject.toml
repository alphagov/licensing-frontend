[project]
name = "licensing-frontend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "crispy-forms-gds>=2.0.1",
    "django~=5.2",
    "django-mongodb-backend>=5.2.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.8.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120

extend-exclude = [
    "migrations/versions/",
    "__pycache__",
    "cache",
    "migrations",
]

[tool.ruff.lint]
extend-select = [
    "DJ",
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C90",
    "G",
    "T20",
    "C4",
    "ISC",
    "RSE",
    "PIE",
    "N804",
    "RUF100",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
