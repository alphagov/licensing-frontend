services:
  document_db:
    image: ${DOCUMENTDB_IMAGE:-ghcr.io/documentdb/documentdb/documentdb-local:latest}
    environment:
      - USERNAME=${DOCUMENTDB_USER:-docdb}
      - PASSWORD=${DOCUMENTDB_PASSWORD:-password}
    ports:
      - ${DOCUMENTDB_PORT:-10260}:10260
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"

  clamav:
    image: clamav/clamav:stable-debian13-slim
    container_name: clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      - CLAMAV_NO_FRESHCLAM=true
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: [ "CMD", "clamdcheck.sh" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  citizen_frontend:
    depends_on:
      - document_db
      - ministack
      - clamav
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-=nps**-gh4$3@&=8_f@+^a&@tsr*x-b3hbzf#o0ec@12i2=np^}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-0.0.0.0,localhost,127.0.0.1}
      IS_PRODUCTION: ${IS_PRODUCTION:-False}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:8000}
      DOCUMENTDB_USER: ${DOCUMENTDB_USER}
      DOCUMENTDB_PASSWORD: ${DOCUMENTDB_PASSWORD}
      DOCUMENTDB_PORT: ${DOCUMENTDB_PORT}
      DOCUMENTDB_HOST: ${DOCUMENTDB_HOST:-document_db}
      DOCUMENTDB_ALLOW_INVALID_CERTS: ${DOCUMENTDB_ALLOW_INVALID_CERTS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-testing}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-testing}
      AWS_SECURITY_TOKEN: ${AWS_SECURITY_TOKEN:-testing}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-testing}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-test-bucket}
      S3_ENDPOINT_URL: http://ministack:4566
      VIRUS_SCANNER_ENDPOINT: http://clamav:3310
    ports:
      - ${CITIZEN_FRONTEND_PORT:-8000}:${CITIZEN_FRONTEND_PORT:-8000}
    develop:
      watch:
        - action: sync+restart
          path: ./citizen_frontend
          target: app/citizen_frontend/
          ignore:
            - tests/
        - action: sync
          path: ./config
          target: app/config/
        - action: sync
          path: ./static
          target: app/static/
        - action: rebuild
          path: ./uv.lock
          target: app/uv.lock